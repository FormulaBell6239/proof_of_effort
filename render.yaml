databases:
  - name: poe-db
    databaseName: proof_of_effort
    user: poe_user

services:
  - type: web
    name: poe-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: DATABASE_URL
        fromDatabase:
          name: poe-db
          property: connectionString
      # Set this after the frontend deploys (Render will show its URL)
      - key: CORS_ORIGIN
        value: https://CHANGE-ME.onrender.com

  - type: static
    name: poe-frontend
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your backend Render URL, e.g. https://poe-backend.onrender.com
      - key: VITE_API_BASE_URL
        value: https://CHANGE-ME.onrender.com
