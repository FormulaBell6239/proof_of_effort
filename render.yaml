databases:
  - name: poe-db
    databaseName: proof_of_effort
    user: poe_user
    plan: free

services:
  - type: web
    name: poe-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    preDeployCommand: node scripts/migrate.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: poe-db
          property: connectionString
      # After deploying the frontend, set this to your frontend Render URL
      # e.g. https://poe-frontend.onrender.com
      - key: CORS_ORIGIN
        sync: false
      # Generate with: openssl rand -hex 32
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: ALLOWED_FILE_TYPES
        value: image/jpeg,image/png,image/jpg,application/pdf,video/mp4
      - key: LOG_LEVEL
        value: info

  - type: static
    name: poe-frontend
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your backend Render URL after deploying the backend
      # e.g. https://poe-backend.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
